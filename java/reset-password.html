<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重設密碼 — Snakify Practice Platform · Java</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-overlay">
    <div class="auth-card auth-card-wide">
      <h1>重設密碼</h1>
      <p id="reset-status" class="auth-subtitle">正在驗證連結…</p>
      <form id="reset-form" class="auth-form hidden">
        <input type="password" id="reset-password" placeholder="新密碼（至少 6 字元）" required minlength="6" autocomplete="new-password">
        <input type="password" id="reset-password-confirm" placeholder="確認新密碼" required minlength="6" autocomplete="new-password">
        <button type="submit" class="btn primary auth-submit-btn">更新密碼</button>
      </form>
      <p id="reset-error" class="auth-error hidden"></p>
      <p id="reset-success" class="auth-success hidden"></p>
      <a href="index.html" class="link-btn" style="display:inline-block;margin-top:1rem;">返回首頁</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.86.2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/user-account.js"></script>
  <script>
    (async () => {
      const statusEl = document.getElementById("reset-status");
      const form = document.getElementById("reset-form");
      const errorEl = document.getElementById("reset-error");
      const successEl = document.getElementById("reset-success");

      if (!UserAccount.isEnabled()) {
        statusEl.textContent = "尚未設定 Supabase，無法重設密碼。";
        return;
      }

      const client = UserAccount.getClient();
      let ready = false;

      client.auth.onAuthStateChange((event) => {
        if (event === "PASSWORD_RECOVERY") {
          ready = true;
          statusEl.textContent = "請輸入新密碼。";
          form.classList.remove("hidden");
        }
      });

      const { data } = await client.auth.getSession();
      if (data.session) {
        ready = true;
        statusEl.textContent = "請輸入新密碼。";
        form.classList.remove("hidden");
      }

      if (!ready && window.location.hash.includes("access_token")) {
        await new Promise((r) => setTimeout(r, 800));
        const retry = await client.auth.getSession();
        if (retry.data.session) {
          ready = true;
          statusEl.textContent = "請輸入新密碼。";
          form.classList.remove("hidden");
        }
      }

      if (!ready) {
        statusEl.textContent = "連結無效或已過期，請重新申請重設密碼。";
        return;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorEl.classList.add("hidden");
        successEl.classList.add("hidden");

        const password = document.getElementById("reset-password").value;
        const confirm = document.getElementById("reset-password-confirm").value;

        if (password !== confirm) {
          errorEl.textContent = "兩次輸入的密碼不一致";
          errorEl.classList.remove("hidden");
          return;
        }

        const { error } = await client.auth.updateUser({ password });
        if (error) {
          errorEl.textContent = UserAccount.formatError(error);
          errorEl.classList.remove("hidden");
          return;
        }

        successEl.textContent = "密碼已更新！3 秒後返回首頁…";
        successEl.classList.remove("hidden");
        form.classList.add("hidden");
        setTimeout(() => {
          window.location.href = "index.html";
        }, 3000);
      });
    })();
  </script>
</body>
</html>
