<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snakify Practice Platform — 互動式程式練習</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --border: #2d3a4f;
      --text: #e7ecf3;
      --muted: #9aa8bc;
      --accent: #3b82f6;
      --accent2: #8b5cf6;
      --font: "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
    }
    h1 { margin: 0 0 0.5rem; font-size: 2rem; text-align: center; }
    .subtitle { color: var(--muted); margin: 0 0 2.5rem; text-align: center; max-width: 520px; }
    .cards {
      display: grid;
      gap: 1.25rem;
      width: min(640px, 100%);
    }
    .card {
      display: block;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem 1.75rem;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s, transform 0.15s;
    }
    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .card.cpp:hover { border-color: var(--accent2); }
    .card h2 { margin: 0 0 0.35rem; font-size: 1.35rem; }
    .card p { margin: 0; color: var(--muted); font-size: 0.95rem; line-height: 1.5; }
    .badge {
      display: inline-block;
      margin-top: 0.75rem;
      padding: 0.2rem 0.55rem;
      border-radius: 4px;
      font-size: 0.78rem;
      font-weight: 700;
      color: #fff;
      background: var(--accent);
    }
    .card.cpp .badge { background: var(--accent2); }
    footer { margin-top: 3rem; color: var(--muted); font-size: 0.85rem; text-align: center; }
  </style>
</head>
<body>
  <h1>Snakify Practice Platform</h1>
  <p class="subtitle">互動式程式練習平台 · 瀏覽器寫程式、自動測試、雲端儲存進度</p>

  <div class="cards">
    <a class="card" href="java/">
      <h2>Java</h2>
      <p>第 1～3 章 · Java 入門練題（中／英雙語）</p>
      <span class="badge">Java</span>
    </a>
    <a class="card cpp" href="cpp/">
      <h2>C++</h2>
      <p>第 1～2 章 · C++ 入門練題（中／英雙語）</p>
      <span class="badge">C++</span>
    </a>
  </div>

  <footer>自用教學平台 · Judge0 / Piston 執行程式</footer>
</body>
</html>
